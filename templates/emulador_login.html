<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Acceso al Emulador - {{ nombre_pagina }}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --azul: #2563eb;
            --azul-osc: #1d4ed8;
            --tinta: #0f172a;
            --gris: #64748b;
            --borde: #e2e8f0;
            --fondo: #f1f5f9;
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body {
            font-family: 'Poppins', system-ui, sans-serif;
            color: var(--tinta);
            background: var(--fondo);
            display: grid;
            place-items: center;
            padding: 16px;
        }
        .tarjeta {
            width: 100%;
            max-width: 360px;
            background: #ffffff;
            border: 1px solid var(--borde);
            border-radius: 16px;
            padding: 24px 22px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
        }
        h1 { margin: 0 0 4px; font-size: 1.15rem; font-weight: 700; }
        .instancia { margin: 0 0 14px; font-size: 0.78rem; color: var(--gris); }
        .aviso {
            margin: 0 0 14px;
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 0.8rem;
            line-height: 1.4;
        }
        .aviso.error { background: #fee2e2; color: #991b1b; font-weight: 500; }
        .aviso.bloqueado { background: #fef3c7; color: #92400e; }
        label { display: block; margin-bottom: 6px; font-size: 0.8rem; font-weight: 600; }
        input[type="password"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--borde);
            border-radius: 10px;
            font-family: inherit;
            font-size: 16px;
            color: var(--tinta);
            margin-bottom: 14px;
        }
        input[type="password"]:focus { outline: 2px solid rgba(37, 99, 235, 0.25); border-color: var(--azul); }
        button {
            width: 100%;
            padding: 10px 14px;
            border: none;
            border-radius: 999px;
            background: var(--azul);
            color: #ffffff;
            font-family: inherit;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            min-height: 42px;
        }
        button:hover { background: var(--azul-osc); }
        .volver { display: block; margin-top: 14px; text-align: center; font-size: 0.78rem; color: var(--gris); text-decoration: none; }
        .volver:hover { color: var(--azul); }
    </style>
</head>
<body>
    <main class="tarjeta">
        <h1>🔒 Emulador del Auto 1</h1>
        <p class="instancia">{{ nombre_pagina }}</p>

        {% if sin_clave %}
            <p class="aviso bloqueado">
                El acceso al emulador está bloqueado porque falta definir <code>EMULADOR_CLAVE</code> en el archivo <code>.env</code> del servidor.
            </p>
        {% else %}
            {% if error %}
                <p class="aviso error">{{ error }}</p>
            {% endif %}
            <form method="post" action="/emulador">
                <label for="clave">Clave de acceso</label>
                <input type="password" id="clave" name="clave" placeholder="Ingresa la clave" autocomplete="current-password" autofocus required>
                <button type="submit">Entrar</button>
            </form>
        {% endif %}

        <a class="volver" href="/">← Volver al mapa en vivo</a>
    </main>
</body>
</html>
