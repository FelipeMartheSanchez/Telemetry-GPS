<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ nombre_pagina }}</title>

    <!-- Fuente moderna (Poppins) -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <!-- Librerías para Mapa (Leaflet) y Socket.IO -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        /* El mapa ocupa TODA la ventana; la interfaz flota encima. */
        html, body {
            height: 100%;
            overflow: hidden;
            background-color: #f4f7f6;
            color: #333;
        }

        .mapa-contenedor {
            position: fixed;
            inset: 0;
        }

        #map {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        /* Panel flotante (arriba a la izquierda) */
        .panel {
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 1100;               /* sobre el mapa y la pantalla de carga */
            width: min(340px, calc(100vw - 24px));
            max-height: calc(100vh - 24px);
            max-height: calc(100dvh - 24px);
            overflow-y: auto;
            background: rgba(255, 255, 255, 0.96);
            border: 1px solid #e2e8f0;
            border-radius: 18px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
            padding: 14px 16px;
        }

        h1 {
            font-size: 1.05rem;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 10px;
        }

        /* Menú desplegable compacto */
        .selector-modo {
            width: auto;
            min-width: 170px;
            padding: 6px 12px;
            border-radius: 12px;
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            font-size: 0.82rem;
            font-weight: 600;
            color: #1e293b;
            cursor: pointer;
            margin-bottom: 12px;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .selector-modo:hover {
            border-color: #94a3b8;
        }

        .selector-modo:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
            background: #ffffff;
        }


        /* Recuadro de marca (arriba, al centro): nombre de la empresa y,
           debajo, el nombre de esta instancia (NOMBRE_PAGINA del .env). */
        .marca {
            position: fixed;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1100;
            padding: 6px 18px 7px;
            background: rgba(255, 255, 255, 0.96);
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
            text-align: center;
            pointer-events: none;
            white-space: nowrap;
        }

        .marca-logo {
            display: block;
            width: 190px;
            max-width: 100%;
            height: auto;
            margin: 0 auto 2px;
        }

        .marca-instancia {
            font-size: 0.66rem;
            font-weight: 500;
            line-height: 1.2;
            color: #64748b;
        }

        /* Cabecera del panel: el selector de modo va primero, con el boton
           para plegar el panel a su lado (igual en En vivo e Histórico). */
        .panel-cabecera {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }

        .panel-cabecera .selector-modo {
            flex: 1;
            min-width: 0;
            width: auto;
            margin-bottom: 0;
        }

        .btn-panel {
            flex: none;
            border: none;
            background: #e2e8f0;
            color: #475569;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-size: 0.9rem;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .panel.colapsado .panel-cuerpo { display: none; }
        .panel.colapsado .panel-cabecera { margin-bottom: 0; }
        .panel.colapsado .btn-panel { transform: rotate(180deg); }

        /* En pantallas angostas el panel ocupa casi todo el ancho: el recuadro
           de marca pasa abajo para no taparse con el. */
        @media (max-width: 640px) {
            .marca {
                top: auto;
                bottom: 22px;
                bottom: calc(22px + env(safe-area-inset-bottom, 0px));
                padding: 4px 12px 5px;
            }
            .marca-logo { width: 120px; }
            .marca-instancia { font-size: 0.62rem; }
        }

        /* Dirección y barrio donde está el vehículo */
        .ubicacion {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 14px;
            padding: 10px 12px;
            margin-bottom: 10px;
        }

        .dato-etiqueta {
            font-size: 0.68rem;
            font-weight: 600;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .dato-valor {
            font-size: 0.9rem;
            font-weight: 600;
            color: #0f172a;
            word-break: break-word;
        }

        .ubicacion .dato-valor + .dato-etiqueta { margin-top: 6px; }

        /* Fecha y hora */
        .datos {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 8px;
        }

        .datos > div {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 6px 8px;
        }

        .datos .dato-valor { font-size: 0.8rem; }

        /* Desplegable "Opciones avanzadas": envíos, latitud y longitud */
        details.coordenadas {
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            background: #f8fafc;
        }

        details.coordenadas summary {
            cursor: pointer;
            padding: 8px 12px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #2563eb;
            list-style: none;
        }

        details.coordenadas summary::-webkit-details-marker { display: none; }
        details.coordenadas summary::before { content: '▸ '; }
        details.coordenadas[open] summary::before { content: '▾ '; }

        .coordenadas-cuerpo .fila-completa { grid-column: 1 / -1; }

        .coordenadas-cuerpo {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            padding: 0 12px 10px;
        }

        .leaflet-control-zoom { margin-bottom: 24px !important; }

        /* ===== Pantalla de carga (solo sobre el mapa) ===== */
        #pantallaCarga {
            position: absolute;
            inset: 0;
            background: rgba(244, 247, 246, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            z-index: 1001;          /* por encima de los controles de Leaflet (1000) */
            transition: opacity 0.4s ease;
        }

        #pantallaCarga.oculta {
            opacity: 0;
            pointer-events: none;
        }

        #camionSvg {
            width: 230px;
            height: auto;
            overflow: visible;
        }

        /* El cuerpo del camion rebota suavemente, como si fuera andando */
        .camion-cuerpo {
            animation: rebote 0.6s ease-in-out infinite alternate;
        }

        @keyframes rebote {
            from { transform: translateY(0); }
            to   { transform: translateY(-2px); }
        }

        /* Ruedas girando: fill-box hace que cada rueda gire sobre su propio centro */
        .rueda {
            transform-box: fill-box;
            transform-origin: center;
            animation: girar 0.8s linear infinite;
        }

        @keyframes girar {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }

        /* Lineas de la carretera moviendose hacia atras */
        .carretera {
            animation: avanzar 0.6s linear infinite;
        }

        @keyframes avanzar {
            from { transform: translateX(0); }
            to   { transform: translateX(-40px); }
        }

        /* Lineas de velocidad detras del camion */
        .velocidad line {
            animation: parpadeo 0.8s ease-in-out infinite;
        }

        .velocidad line:nth-child(2) { animation-delay: 0.2s; }
        .velocidad line:nth-child(3) { animation-delay: 0.4s; }

        @keyframes parpadeo {
            0%, 100% { opacity: 0.2; }
            50%      { opacity: 0.8; }
        }

        /* Estado de error: todo se detiene, llantas espichadas, camion inclinado */
        #pantallaCarga.error .camion-cuerpo,
        #pantallaCarga.error .carretera,
        #pantallaCarga.error .velocidad line {
            animation: none;
        }

        #pantallaCarga.error .velocidad {
            display: none;
        }

        #pantallaCarga.error .rueda {
            animation: none;
            transform-origin: center bottom;
            transform: scale(1.12, 0.7);
        }

        #pantallaCarga.error .camion-cuerpo {
            transform: rotate(-3deg) translateY(5px);
            transform-box: fill-box;
            transform-origin: center bottom;
        }

        #textoCarga {
            font-size: 0.95rem;
            font-weight: 600;
            color: #64748b;
            text-align: center;
            max-width: 320px;
            padding: 0 15px;
        }

        #pantallaCarga.advertencia #textoCarga {
            color: #b45309;
        }

        #pantallaCarga.error #textoCarga {
            color: #991b1b;
        }

        /* Boton de reintentar: solo aparece en el estado de error */
        #btnCerrarCarga {
            display: none;
            padding: 8px 22px;
            border: none;
            border-radius: 50px;
            background: #2563eb;
            color: #ffffff;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        #btnCerrarCarga:hover {
            background: #1d4ed8;
        }

        #pantallaCarga.error #btnCerrarCarga {
            display: inline-block;
        }
        .icono-vivo { font-size: 26px; text-align: center; line-height: 30px; cursor: pointer;
                      transition: opacity 0.3s ease, font-size 0.2s ease; }
        .icono-vivo.sin-senal { opacity: 0.45; }
        /* Auto enfocado (se tocó su emoji): un poco más grande y con aureola */
        .icono-vivo.enfocado { font-size: 34px;
                               filter: drop-shadow(0 0 3px #ffffff) drop-shadow(0 0 7px rgba(37, 99, 235, 0.85)); }

        /* Etiqueta fija bajo cada vehiculo ("Auto 1" / "Auto 2") */
        .etiqueta-auto {
            font-weight: 600;
            font-size: 0.7rem;
            padding: 1px 8px;
            border: none;
            border-radius: 8px;
            color: #ffffff;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
            transition: opacity 0.3s ease;
        }
        .etiqueta-auto::before { display: none; }
        .etiqueta-auto.auto-1 { background: #2563eb; }
        .etiqueta-auto.auto-2 { background: #ea580c; }
        .etiqueta-auto.sin-senal { opacity: 0.45; }

        /* Una tarjeta por vehiculo en el panel */
        .auto-tarjeta {
            border-left: 4px solid #2563eb;
            border-radius: 6px;
            padding-left: 8px;
            margin-bottom: 12px;
        }
        .auto-tarjeta.auto-2 { border-left-color: #ea580c; }
        .auto-tarjeta:last-child { margin-bottom: 0; }

        .auto-titulo {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            min-height: 36px;
            margin-bottom: 6px;
            padding: 2px 4px;
            border: none;
            background: transparent;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 700;
            color: #0f172a;
            text-align: left;
            cursor: pointer;
        }
        .auto-titulo .auto-emoji { font-size: 1.2rem; }
        .auto-estado {
            margin-left: auto;
            padding: 2px 8px;
            border-radius: 999px;
            background: #dcfce7;
            color: #166534;
            font-size: 0.68rem;
            font-weight: 600;
            white-space: nowrap;
        }
        .auto-estado.sin-senal { background: #fef3c7; color: #92400e; }
        .panel #esperandoAutos { color: #64748b; font-weight: 500; }

        /* Con dos vehiculos el panel crece: en el celular se compacta para dejar ver el mapa */
        @media (max-width: 640px) {
            .auto-tarjeta { margin-bottom: 8px; padding-left: 6px; }
            .auto-titulo { min-height: 30px; margin-bottom: 2px; font-size: 0.85rem; }
            .auto-tarjeta .ubicacion { padding: 6px 10px; margin-bottom: 6px; }
            .auto-tarjeta .ubicacion .dato-valor { font-size: 0.82rem; }
            .auto-tarjeta .datos { gap: 6px; margin-bottom: 6px; }
            .auto-tarjeta .datos > div { padding: 3px 8px; }
            .auto-tarjeta details.coordenadas summary { padding: 6px 12px; }
        }

        /* Selector de enfoque: Ambos / Auto 1 / Auto 2 (solo si los dos autos ya enviaron) */
        .selector-enfoque {
            display: none;
            position: fixed;
            left: 50%;
            bottom: 24px;
            transform: translateX(-50%);
            z-index: 1100;
            gap: 4px;
            padding: 4px;
            background: rgba(255, 255, 255, 0.96);
            border: 1px solid #e2e8f0;
            border-radius: 999px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
        }
        .selector-enfoque.visible { display: flex; }
        .selector-enfoque button {
            min-height: 40px;
            padding: 4px 14px;
            border: none;
            border-radius: 999px;
            background: transparent;
            font-family: inherit;
            font-size: 0.82rem;
            font-weight: 600;
            color: #334155;
            white-space: nowrap;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .selector-enfoque button:hover { background: #f1f5f9; }
        .selector-enfoque button.activa { background: #2563eb; color: #ffffff; }
        .auto-tarjeta.enfocada { box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.45); }

        /* En el celular la marca ocupa el borde inferior: el selector sube sobre ella
           y deja libre la columna del zoom a la derecha. */
        @media (max-width: 640px) {
            .selector-enfoque {
                bottom: calc(84px + env(safe-area-inset-bottom, 0px));
                max-width: calc(100vw - 120px);
            }
            .selector-enfoque button { padding: 4px 10px; font-size: 0.76rem; }
        }
</style>
</head>
<body>

    <!-- Mapa a pantalla completa con su pantalla de carga encima -->
    <div class="mapa-contenedor">
        <div id="map"></div>

        <div id="pantallaCarga">
            <svg id="camionSvg" viewBox="0 0 240 150" xmlns="http://www.w3.org/2000/svg">
                <!-- Carretera -->
                <line x1="0" y1="138" x2="240" y2="138" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
                <g class="carretera">
                    <line x1="0"   y1="146" x2="20"  y2="146" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
                    <line x1="40"  y1="146" x2="60"  y2="146" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
                    <line x1="80"  y1="146" x2="100" y2="146" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
                    <line x1="120" y1="146" x2="140" y2="146" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
                    <line x1="160" y1="146" x2="180" y2="146" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
                    <line x1="200" y1="146" x2="220" y2="146" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
                    <line x1="240" y1="146" x2="260" y2="146" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
                </g>

                <!-- Lineas de velocidad -->
                <g class="velocidad" stroke="#93c5fd" stroke-width="3" stroke-linecap="round">
                    <line x1="0"  y1="55" x2="14" y2="55"/>
                    <line x1="4"  y1="70" x2="14" y2="70"/>
                    <line x1="0"  y1="85" x2="14" y2="85"/>
                </g>

                <!-- Sombra -->
                <ellipse cx="125" cy="136" rx="100" ry="4" fill="#0f172a" opacity="0.12"/>

                <g class="camion-cuerpo">
                    <!-- Caja de carga -->
                    <rect x="22" y="28" width="122" height="72" rx="10" fill="#2563eb"/>
                    <rect x="22" y="28" width="122" height="14" rx="10" fill="#3b82f6"/>
                    <rect x="22" y="36" width="122" height="6" fill="#3b82f6"/>
                    <!-- Lineas de la puerta trasera -->
                    <line x1="32" y1="48" x2="32" y2="92" stroke="#1d4ed8" stroke-width="2" stroke-linecap="round"/>

                    <!-- Pin de ubicacion en la caja (telemetria GPS) -->
                    <path d="M83 48 c-9 0 -15 7 -15 15 c0 11 15 25 15 25 s15 -14 15 -25 c0 -8 -6 -15 -15 -15 z" fill="#ffffff"/>
                    <circle cx="83" cy="63" r="5.5" fill="#2563eb"/>

                    <!-- Cabina -->
                    <path d="M148 50 h36 q7 0 11 6 l17 24 q3 4 3 9 v19 h-67 z" fill="#1d4ed8"/>
                    <!-- Ventana -->
                    <path d="M158 57 h24 q4 0 6 3 l12 18 h-42 z" fill="#dbeafe"/>
                    <path d="M162 60 l6 0 l-4 14 l-5 0 z" fill="#ffffff" opacity="0.7"/>
                    <!-- Manija de la puerta -->
                    <rect x="162" y="86" width="10" height="3" rx="1.5" fill="#93c5fd"/>
                    <!-- Faro -->
                    <rect x="207" y="92" width="8" height="7" rx="2" fill="#fde68a"/>

                    <!-- Chasis y parachoques -->
                    <rect x="18" y="100" width="198" height="10" rx="4" fill="#1e3a8a"/>
                    <rect x="208" y="104" width="12" height="7" rx="3" fill="#475569"/>
                </g>

                <!-- Ruedas -->
                <g class="rueda">
                    <circle cx="58" cy="118" r="17" fill="#0f172a"/>
                    <circle cx="58" cy="118" r="9" fill="#cbd5e1"/>
                    <line x1="58" y1="110" x2="58" y2="126" stroke="#64748b" stroke-width="2.5"/>
                    <line x1="50" y1="118" x2="66" y2="118" stroke="#64748b" stroke-width="2.5"/>
                    <circle cx="58" cy="118" r="3" fill="#334155"/>
                </g>
                <g class="rueda">
                    <circle cx="180" cy="118" r="17" fill="#0f172a"/>
                    <circle cx="180" cy="118" r="9" fill="#cbd5e1"/>
                    <line x1="180" y1="110" x2="180" y2="126" stroke="#64748b" stroke-width="2.5"/>
                    <line x1="172" y1="118" x2="188" y2="118" stroke="#64748b" stroke-width="2.5"/>
                    <circle cx="180" cy="118" r="3" fill="#334155"/>
                </g>
            </svg>

            <div id="textoCarga">Conectando con el vehículo...</div>
            <button id="btnCerrarCarga">Reintentar conexión</button>
        </div>
    </div>

    <!-- Marca: nombre de la empresa y de esta instancia -->
    <div class="marca">
        <img class="marca-logo" src="{{ url_for('static', filename='trucktrace-logo.jpg') }}" alt="TruckTrace">
        <div class="marca-instancia">{{ nombre_pagina }}</div>
    </div>

    <!-- Panel flotante sobre el mapa -->
    <div class="panel" id="panel">
        <div class="panel-cabecera">
            <select class="selector-modo" onchange="window.location.href=this.value;" aria-label="Cambiar de modo">
                <option value="/" selected>📡 Modo: En vivo</option>
                <option value="/historial">🕘 Modo: Histórico</option>
            </select>
            <button type="button" id="btnPanel" class="btn-panel" aria-expanded="true"
                    title="Mostrar u ocultar el panel">▾</button>
        </div>

        <div class="panel-cuerpo">
        <!-- Una tarjeta por vehículo: se crea cuando llega su primer dato. -->
        <div id="esperandoAutos" class="dato-valor">Esperando ubicación...</div>
        <div id="tarjetasAutos"></div>
        </div>
    </div>

    <!-- Enfoque de la cámara: aparece cuando los dos autos ya enviaron. Tocar el
         emoji de un auto en el mapa hace lo mismo que el botón de ese auto. -->
    <div id="selectorEnfoque" class="selector-enfoque" role="group" aria-label="Enfocar vehículo">
        <button type="button" data-enfoque="todos" class="activa" aria-pressed="true">🚚🚛 Ambos</button>
        <button type="button" data-enfoque="1" aria-pressed="false">🚚 Auto 1</button>
        <button type="button" data-enfoque="2" aria-pressed="false">🚛 Auto 2</button>
    </div>

    <script>
        // Inicializar Mapa centrado en Colombia por defecto
        const map = L.map('map', { zoomControl: false }).setView([4.570868, -74.297333], 6);
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // --- Vehiculos ---
        // Cada vehiculo (la app de cada celular manda "Vehiculo: 1" o "2") tiene
        // su marcador, su linea de recorrido, su tarjeta en el panel y su
        // propio control de direccion. Se crean al llegar su primer dato.
        const CONFIG_AUTOS = {
            1: { nombre: 'Auto 1', emoji: '🚚', color: '#2563eb' },
            2: { nombre: 'Auto 2', emoji: '🚛', color: '#ea580c' }
        };
        const SIN_SENAL_MS = 30000;   // sin datos por mas de 30 s = "sin senal"
        const autos = {};

        let esPrimeraUbicacion = true;

        // ===== Enfoque de la cámara =====
        // 'todos': se ven los dos autos (comportamiento de siempre). 1 o 2: la cámara
        // sigue a ese auto y los datos del otro no la mueven. Se elige tocando el emoji
        // del auto en el mapa (o su botón / el título de su tarjeta); tocar otra vez el
        // mismo auto vuelve a 'todos'.
        let enfoque = 'todos';
        const selectorEnfoque = document.getElementById('selectorEnfoque');

        // Zona del mapa que no tapan los paneles flotantes (en pixeles del mapa):
        // en PC, a la derecha del panel; en el celular, entre el panel de arriba y la
        // marca / selector de abajo. La camara centra y encuadra los autos AHI, para
        // que no queden escondidos detras del panel.
        function zonaLibre() {
            const tam = map.getSize();
            const r = panel.getBoundingClientRect();
            const angosta = window.matchMedia('(max-width: 640px)').matches;
            if (!angosta) return { x0: Math.min(r.right + 12, tam.x * 0.6), y0: 0, x1: tam.x, y1: tam.y };
            let y1 = tam.y;
            [document.querySelector('.marca'), selectorEnfoque].forEach(function(el) {
                if (el && getComputedStyle(el).display !== 'none') y1 = Math.min(y1, el.getBoundingClientRect().top - 8);
            });
            const y0 = r.bottom + 8;
            // Si el panel (abierto) ocupa casi todo el celular no queda zona libre:
            // se usa todo el mapa (fijarEnfoque pliega el panel antes de enfocar).
            if (y1 - y0 < 120) return { x0: 0, y0: 0, x1: tam.x, y1: y1 };
            return { x0: 0, y0: y0, x1: tam.x, y1: y1 };
        }

        // En el celular, si el panel abierto tapa el mapa, se pliega para que el auto
        // enfocado se vea (el encabezado del panel queda para volver a abrirlo).
        function plegarPanelSiTapa() {
            if (!window.matchMedia('(max-width: 640px)').matches) return;
            if (panel.classList.contains('colapsado')) return;
            const z = zonaLibre();
            if (z.y0 === 0 && panel.getBoundingClientRect().bottom > 0) {
                panel.classList.add('colapsado');
                btnPanel.setAttribute('aria-expanded', 'false');
            }
        }

        // Centro del mapa que deja 'latlng' en el centro de la zona libre.
        function centroParaZona(latlng, zoom) {
            const z = zonaLibre(), tam = map.getSize();
            const desp = L.point((z.x0 + z.x1) / 2 - tam.x / 2, (z.y0 + z.y1) / 2 - tam.y / 2);
            return map.unproject(map.project(latlng, zoom).subtract(desp), zoom);
        }

        function encuadrar(latlngs) {
            const z = zonaLibre(), tam = map.getSize();
            map.fitBounds(L.latLngBounds(latlngs), {
                paddingTopLeft: [z.x0 + 24, z.y0 + 24],
                paddingBottomRight: [tam.x - z.x1 + 24, tam.y - z.y1 + 24],
                maxZoom: 16
            });
        }

        function actualizarSelectorEnfoque() {
            selectorEnfoque.classList.toggle('visible', Boolean(autos[1] && autos[2]));
            selectorEnfoque.querySelectorAll('button').forEach(function(b) {
                const activo = b.dataset.enfoque === String(enfoque);
                b.classList.toggle('activa', activo);
                b.setAttribute('aria-pressed', String(activo));
            });
            Object.values(autos).forEach(function(a) {
                const enfocado = (enfoque === a.id);
                const icono = a.marker.getElement();
                if (icono) icono.classList.toggle('enfocado', enfocado);
                a.tarjeta.classList.toggle('enfocada', enfocado);
            });
        }

        function fijarEnfoque(valor) {
            enfoque = (valor === 'todos') ? 'todos' : Number(valor);
            if (enfoque !== 'todos' && !autos[enfoque]) enfoque = 'todos';
            actualizarSelectorEnfoque();
            plegarPanelSiTapa();

            if (enfoque === 'todos') {
                const lista = Object.values(autos);
                const activos = lista.filter(enLinea);
                const usar = activos.length ? activos : lista;
                if (usar.length >= 2) {
                    encuadrar(usar.map(a => a.marker.getLatLng()));
                } else if (usar.length === 1) {
                    map.panTo(centroParaZona(usar[0].marker.getLatLng(), map.getZoom()));
                }
            } else {
                const zoom = Math.max(map.getZoom(), 16);
                map.setView(centroParaZona(autos[enfoque].marker.getLatLng(), zoom), zoom, { animate: true });
            }
        }

        function alternarEnfoque(id) {
            fijarEnfoque(enfoque === id ? 'todos' : id);
        }

        // Con un auto enfocado, la cámara solo se mueve si el auto se sale de la zona
        // central: se queda a la vista sin saltar en cada dato.
        function seguirEnfocado(auto) {
            const posicion = auto.marker.getLatLng();
            const z = zonaLibre();
            const p = map.latLngToContainerPoint(posicion);
            const mx = (z.x1 - z.x0) * 0.2, my = (z.y1 - z.y0) * 0.2;
            const dentro = p.x > z.x0 + mx && p.x < z.x1 - mx && p.y > z.y0 + my && p.y < z.y1 - my;
            if (!dentro) map.panTo(centroParaZona(posicion, map.getZoom()));
        }

        selectorEnfoque.addEventListener('click', function(e) {
            const boton = e.target.closest('button[data-enfoque]');
            if (boton) fijarEnfoque(boton.dataset.enfoque);
        });

        // ===== Pantalla de carga =====
        // Cubre SOLO el mapa, no toda la página: el usuario puede cambiar a
        // la pestaña de Histórico o leer las cápsulas mientras espera.
        // A los 20 s avisa que está tardando; a los 40 s muestra el error
        // con el botón "Reintentar conexión".
        const pantallaCarga = document.getElementById('pantallaCarga');
        const textoCarga = document.getElementById('textoCarga');
        const btnCerrarCarga = document.getElementById('btnCerrarCarga');

        let timerAdvertencia = null;
        let timerError = null;

        // Pone la pantalla en estado "cargando" con el mensaje indicado y
        // arranca los dos avisos. Se usa al abrir la página y en cada reintento.
        function iniciarEspera(mensaje) {
            clearTimeout(timerAdvertencia);
            clearTimeout(timerError);

            pantallaCarga.classList.remove('advertencia', 'error', 'oculta');
            textoCarga.innerText = mensaje;

            timerAdvertencia = setTimeout(function() {
                pantallaCarga.classList.add('advertencia');
                textoCarga.innerText = 'Esto está tardando más de lo normal. Verifica que se haya activado el recorrido.';
            }, 20000);

            timerError = setTimeout(function() {
                pantallaCarga.classList.remove('advertencia');
                pantallaCarga.classList.add('error');
                textoCarga.innerText = 'Ocurrió un error. No se pudo conectar con el vehículo.';
            }, 40000);
        }

        function ocultarPantallaCarga() {
            clearTimeout(timerAdvertencia);
            clearTimeout(timerError);
            pantallaCarga.classList.add('oculta');
        }

        iniciarEspera('Conectando con el vehículo...');

        // Conexión Socket.IO
        const socket = io();

        // Reintentar: si la conexión con el servidor se cayó, la reabre,
        // y vuelve a mostrar el camión esperando el primer dato.
        btnCerrarCarga.addEventListener('click', function() {
            if (!socket.connected) {
                socket.connect();
            }
            iniciarEspera('Intentando conectar de nuevo con el vehículo...');
        });

        // ===== Dirección y barrio =====
        // Se pide al servidor (/api/direccion, que cuida el límite de
        // Nominatim) solo cuando el vehículo se movió al menos 40 m desde la
        // última consulta y pasaron 5 s, para no consultar en cada punto.
        // Cada vehículo lleva su propio control (auto.consulta, auto.consultando).
        function distanciaM(lat1, lon1, lat2, lon2) {
            const r = 6371000, rad = g => g * Math.PI / 180;
            const a = Math.sin(rad(lat2 - lat1) / 2) ** 2 +
                      Math.cos(rad(lat1)) * Math.cos(rad(lat2)) * Math.sin(rad(lon2 - lon1) / 2) ** 2;
            return 2 * r * Math.asin(Math.sqrt(a));
        }

        async function actualizarDireccion(auto, lat, lon) {
            if (auto.consultando) return;
            const ahora = Date.now();
            const ult = auto.consulta;
            if (ult && (ahora - ult.t < 5000 || distanciaM(lat, lon, ult.lat, ult.lon) < 40)) return;

            auto.consultando = true;
            try {
                const r = await fetch(`/api/direccion?lat=${lat}&lon=${lon}`);
                if (!r.ok) throw new Error('sin direccion');
                const d = await r.json();
                const lugar = [d.barrio, d.ciudad].filter(Boolean).join(', ');
                auto.el.direccion.innerText = d.direccion || d.completa || 'Sin dirección disponible';
                auto.el.barrio.innerText = lugar || '---';
                auto.consulta = { lat: lat, lon: lon, t: ahora };
            } catch (e) {
                console.error(e);
                // Se conserva lo último mostrado; se reintenta con el siguiente punto.
                auto.consulta = auto.consulta ? Object.assign(auto.consulta, { t: ahora }) : { lat: 0, lon: 0, t: ahora - 3000 };
            } finally {
                auto.consultando = false;
            }
        }

        // Crea marcador, linea y tarjeta del vehiculo la primera vez que envia.
        function crearAuto(id) {
            const cfg = CONFIG_AUTOS[id];
            const auto = { id: id, cfg: cfg, puntos: [], ultimoMensaje: 0, consulta: null, consultando: false };

            auto.marker = L.marker([4.570868, -74.297333], {
                icon: L.divIcon({ html: cfg.emoji, className: 'icono-vivo', iconSize: [30, 30], iconAnchor: [15, 15] }),
                zIndexOffset: id === 1 ? 0 : 10,
                title: 'Tocar para enfocar el ' + cfg.nombre
            }).addTo(map);
            auto.marker.bindTooltip(cfg.nombre, {
                permanent: true, direction: 'bottom', offset: [0, 12], className: 'etiqueta-auto auto-' + id
            });

            // La polilínea une todos los puntos recibidos en esta sesión.
            auto.linea = L.polyline([], { color: cfg.color, weight: 4, opacity: 0.75 }).addTo(map);

            const tarjeta = document.createElement('section');
            tarjeta.className = 'auto-tarjeta auto-' + id;
            tarjeta.innerHTML = `
                <button type="button" class="auto-titulo" title="Enfocar el mapa en ${cfg.nombre} (tocar de nuevo para ver ambos)">
                    <span class="auto-emoji">${cfg.emoji}</span><span>${cfg.nombre}</span>
                    <span class="auto-estado">En línea</span>
                </button>
                <div class="ubicacion">
                    <div class="dato-etiqueta">Dirección</div>
                    <div class="dato-valor" data-campo="direccion">Esperando ubicación...</div>
                    <div class="dato-etiqueta">Barrio / localidad</div>
                    <div class="dato-valor" data-campo="barrio">---</div>
                </div>
                <div class="datos">
                    <div><div class="dato-etiqueta">Fecha</div><div class="dato-valor" data-campo="fecha">---</div></div>
                    <div><div class="dato-etiqueta">Hora COL</div><div class="dato-valor" data-campo="hora_col">---</div></div>
                </div>
                <details class="coordenadas">
                    <summary>Opciones avanzadas</summary>
                    <div class="coordenadas-cuerpo">
                        <div class="fila-completa"><div class="dato-etiqueta">Envíos</div><div class="dato-valor" data-campo="puntos">0</div></div>
                        <div><div class="dato-etiqueta">Latitud</div><div class="dato-valor" data-campo="lat">---</div></div>
                        <div><div class="dato-etiqueta">Longitud</div><div class="dato-valor" data-campo="lon">---</div></div>
                    </div>
                </details>`;
            const contenedor = document.getElementById('tarjetasAutos');
            // El Auto 1 siempre arriba, aunque el Auto 2 envie primero.
            if (id === 1 && contenedor.firstChild) contenedor.insertBefore(tarjeta, contenedor.firstChild);
            else contenedor.appendChild(tarjeta);
            document.getElementById('esperandoAutos').style.display = 'none';

            auto.tarjeta = tarjeta;
            auto.el = {};
            tarjeta.querySelectorAll('[data-campo]').forEach(function(e) { auto.el[e.dataset.campo] = e; });
            auto.estado = tarjeta.querySelector('.auto-estado');
            // Tocar el emoji del auto en el mapa (o el titulo de su tarjeta) lo enfoca.
            auto.marker.on('click', function() { alternarEnfoque(id); });
            tarjeta.querySelector('.auto-titulo').addEventListener('click', function() { alternarEnfoque(id); });
            autos[id] = auto;
            actualizarSelectorEnfoque();
            return auto;
        }

        function enLinea(auto) {
            return Date.now() - auto.ultimoMensaje < SIN_SENAL_MS;
        }

        // Cada 5 s marca como "sin señal" al vehiculo que dejo de enviar.
        setInterval(function() {
            Object.values(autos).forEach(function(auto) {
                const activo = enLinea(auto);
                const icono = auto.marker.getElement();
                const etiqueta = auto.marker.getTooltip() && auto.marker.getTooltip().getElement();
                if (icono) icono.classList.toggle('sin-senal', !activo);
                if (etiqueta) etiqueta.classList.toggle('sin-senal', !activo);
                auto.estado.classList.toggle('sin-senal', !activo);
                if (activo) {
                    auto.estado.innerText = 'En línea';
                } else {
                    const s = Math.round((Date.now() - auto.ultimoMensaje) / 1000);
                    auto.estado.innerText = 'Sin señal · ' + (s < 90 ? s + ' s' : Math.round(s / 60) + ' min');
                }
            });
        }, 5000);

        socket.on('actualizacion_gps', function(msg) {
            // Apenas llega un dato real, se oculta la pantalla de carga
            // sin importar en qué estado estaba.
            ocultarPantallaCarga();

            console.log('Datos recibidos:', msg);

            // Sin "vehiculo" (servidor o app viejos) se trata como el Auto 1.
            const id = CONFIG_AUTOS[msg.vehiculo] ? Number(msg.vehiculo) : 1;
            const eraNuevo = !autos[id];
            const auto = autos[id] || crearAuto(id);

            // Actualizar texto de la tarjeta de ese vehículo
            auto.el.lat.innerText = msg.latitud;
            auto.el.lon.innerText = msg.longitud;
            auto.el.fecha.innerText = msg.fecha;
            auto.el.hora_col.innerText = msg.hora_col;

            // Convertir coordenadas
            const lat = parseFloat(msg.latitud);
            const lon = parseFloat(msg.longitud);

            if (!isNaN(lat) && !isNaN(lon)) {
                const newLatLng = new L.LatLng(lat, lon);
                auto.ultimoMensaje = Date.now();
                auto.estado.classList.remove('sin-senal');
                auto.estado.innerText = 'En línea';

                // Actualizar la posición del pin
                auto.marker.setLatLng(newLatLng);
                if (auto.marker.getElement()) auto.marker.getElement().classList.remove('sin-senal');

                // Agregar el punto al recorrido y extender la línea.
                auto.puntos.push(newLatLng);
                auto.linea.addLatLng(newLatLng);
                auto.el.puntos.innerText = auto.puntos.length;
                actualizarDireccion(auto, lat, lon);

                const activos = Object.values(autos).filter(enLinea);
                if (esPrimeraUbicacion) {
                    // Solo la primera vez hacemos zoom inicial automático
                    map.setView(newLatLng, 15);
                    esPrimeraUbicacion = false;
                } else if (enfoque !== 'todos') {
                    // Con un auto enfocado, solo sus datos mueven la camara.
                    if (id === enfoque) seguirEnfocado(auto);
                } else if (activos.length >= 2) {
                    // Con los dos vehículos transmitiendo se encuadran ambos; si
                    // ya se ven completos no se toca la cámara (evita saltos
                    // cada vez que llega un dato de uno u otro).
                    const z = zonaLibre();
                    const dentro = activos.every(function(a) {
                        const p = map.latLngToContainerPoint(a.marker.getLatLng());
                        return p.x > z.x0 && p.x < z.x1 && p.y > z.y0 && p.y < z.y1;
                    });
                    if (eraNuevo || !dentro) {
                        encuadrar(activos.map(a => a.marker.getLatLng()));
                    }
                } else {
                    // Solo uno transmite: se sigue suavemente manteniendo el zoom del usuario
                    map.panTo(newLatLng);
                }
            }
        });

        // Plegar / desplegar el panel (el selector de modo siempre queda visible).
        const panel = document.getElementById('panel');
        const btnPanel = document.getElementById('btnPanel');
        btnPanel.addEventListener('click', function() {
            const colapsado = panel.classList.toggle('colapsado');
            btnPanel.setAttribute('aria-expanded', String(!colapsado));
        });
    </script>
</body>
</html>
