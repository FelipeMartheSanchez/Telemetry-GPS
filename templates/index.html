<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ nombre_pagina }}</title>

    <!-- Fuente moderna (Poppins) -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <!-- Librerías para Mapa (Leaflet) y Socket.IO -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        /* El mapa ocupa TODA la ventana; la interfaz flota encima. */
        html, body {
            height: 100%;
            overflow: hidden;
            background-color: #f4f7f6;
            color: #333;
        }

        .mapa-contenedor {
            position: fixed;
            inset: 0;
        }

        #map {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        /* Panel flotante (arriba a la izquierda) */
        .panel {
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 1100;               /* sobre el mapa y la pantalla de carga */
            width: min(340px, calc(100vw - 24px));
            max-height: calc(100vh - 24px);
            overflow-y: auto;
            background: rgba(255, 255, 255, 0.96);
            border: 1px solid #e2e8f0;
            border-radius: 18px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
            padding: 14px 16px;
        }

        h1 {
            font-size: 1.05rem;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 10px;
        }

        /* Menú desplegable compacto */
        .selector-modo {
            width: auto;
            min-width: 170px;
            padding: 6px 12px;
            border-radius: 12px;
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            font-size: 0.82rem;
            font-weight: 600;
            color: #1e293b;
            cursor: pointer;
            margin-bottom: 12px;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .selector-modo:hover {
            border-color: #94a3b8;
        }

        .selector-modo:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
            background: #ffffff;
        }

        /* Dirección y barrio donde está el vehículo */
        .ubicacion {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 14px;
            padding: 10px 12px;
            margin-bottom: 10px;
        }

        .dato-etiqueta {
            font-size: 0.68rem;
            font-weight: 600;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .dato-valor {
            font-size: 0.9rem;
            font-weight: 600;
            color: #0f172a;
            word-break: break-word;
        }

        .ubicacion .dato-valor + .dato-etiqueta { margin-top: 6px; }

        /* Fecha, hora y puntos */
        .datos {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 8px;
        }

        .datos > div {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 6px 8px;
        }

        .datos .dato-valor { font-size: 0.8rem; }

        /* Desplegable de latitud y longitud */
        details.coordenadas {
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            background: #f8fafc;
        }

        details.coordenadas summary {
            cursor: pointer;
            padding: 8px 12px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #2563eb;
            list-style: none;
        }

        details.coordenadas summary::-webkit-details-marker { display: none; }
        details.coordenadas summary::before { content: '▸ '; }
        details.coordenadas[open] summary::before { content: '▾ '; }

        .coordenadas-cuerpo {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            padding: 0 12px 10px;
        }

        .leaflet-control-zoom { margin-bottom: 24px !important; }

        /* ===== Pantalla de carga (solo sobre el mapa) ===== */
        #pantallaCarga {
            position: absolute;
            inset: 0;
            background: rgba(244, 247, 246, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            z-index: 1001;          /* por encima de los controles de Leaflet (1000) */
            transition: opacity 0.4s ease;
        }

        #pantallaCarga.oculta {
            opacity: 0;
            pointer-events: none;
        }

        #camionSvg {
            width: 230px;
            height: auto;
            overflow: visible;
        }

        /* El cuerpo del camion rebota suavemente, como si fuera andando */
        .camion-cuerpo {
            animation: rebote 0.6s ease-in-out infinite alternate;
        }

        @keyframes rebote {
            from { transform: translateY(0); }
            to   { transform: translateY(-2px); }
        }

        /* Ruedas girando: fill-box hace que cada rueda gire sobre su propio centro */
        .rueda {
            transform-box: fill-box;
            transform-origin: center;
            animation: girar 0.8s linear infinite;
        }

        @keyframes girar {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }

        /* Lineas de la carretera moviendose hacia atras */
        .carretera {
            animation: avanzar 0.6s linear infinite;
        }

        @keyframes avanzar {
            from { transform: translateX(0); }
            to   { transform: translateX(-40px); }
        }

        /* Lineas de velocidad detras del camion */
        .velocidad line {
            animation: parpadeo 0.8s ease-in-out infinite;
        }

        .velocidad line:nth-child(2) { animation-delay: 0.2s; }
        .velocidad line:nth-child(3) { animation-delay: 0.4s; }

        @keyframes parpadeo {
            0%, 100% { opacity: 0.2; }
            50%      { opacity: 0.8; }
        }

        /* Estado de error: todo se detiene, llantas espichadas, camion inclinado */
        #pantallaCarga.error .camion-cuerpo,
        #pantallaCarga.error .carretera,
        #pantallaCarga.error .velocidad line {
            animation: none;
        }

        #pantallaCarga.error .velocidad {
            display: none;
        }

        #pantallaCarga.error .rueda {
            animation: none;
            transform-origin: center bottom;
            transform: scale(1.12, 0.7);
        }

        #pantallaCarga.error .camion-cuerpo {
            transform: rotate(-3deg) translateY(5px);
            transform-box: fill-box;
            transform-origin: center bottom;
        }

        #textoCarga {
            font-size: 0.95rem;
            font-weight: 600;
            color: #64748b;
            text-align: center;
            max-width: 320px;
            padding: 0 15px;
        }

        #pantallaCarga.advertencia #textoCarga {
            color: #b45309;
        }

        #pantallaCarga.error #textoCarga {
            color: #991b1b;
        }

        /* Boton de reintentar: solo aparece en el estado de error */
        #btnCerrarCarga {
            display: none;
            padding: 8px 22px;
            border: none;
            border-radius: 50px;
            background: #2563eb;
            color: #ffffff;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        #btnCerrarCarga:hover {
            background: #1d4ed8;
        }

        #pantallaCarga.error #btnCerrarCarga {
            display: inline-block;
        }
        .icono-vivo { font-size: 26px; text-align: center; line-height: 30px; }
</style>
</head>
<body>

    <!-- Mapa a pantalla completa con su pantalla de carga encima -->
    <div class="mapa-contenedor">
        <div id="map"></div>

        <div id="pantallaCarga">
            <svg id="camionSvg" viewBox="0 0 240 150" xmlns="http://www.w3.org/2000/svg">
                <!-- Carretera -->
                <line x1="0" y1="138" x2="240" y2="138" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
                <g class="carretera">
                    <line x1="0"   y1="146" x2="20"  y2="146" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
                    <line x1="40"  y1="146" x2="60"  y2="146" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
                    <line x1="80"  y1="146" x2="100" y2="146" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
                    <line x1="120" y1="146" x2="140" y2="146" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
                    <line x1="160" y1="146" x2="180" y2="146" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
                    <line x1="200" y1="146" x2="220" y2="146" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
                    <line x1="240" y1="146" x2="260" y2="146" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
                </g>

                <!-- Lineas de velocidad -->
                <g class="velocidad" stroke="#93c5fd" stroke-width="3" stroke-linecap="round">
                    <line x1="0"  y1="55" x2="14" y2="55"/>
                    <line x1="4"  y1="70" x2="14" y2="70"/>
                    <line x1="0"  y1="85" x2="14" y2="85"/>
                </g>

                <!-- Sombra -->
                <ellipse cx="125" cy="136" rx="100" ry="4" fill="#0f172a" opacity="0.12"/>

                <g class="camion-cuerpo">
                    <!-- Caja de carga -->
                    <rect x="22" y="28" width="122" height="72" rx="10" fill="#2563eb"/>
                    <rect x="22" y="28" width="122" height="14" rx="10" fill="#3b82f6"/>
                    <rect x="22" y="36" width="122" height="6" fill="#3b82f6"/>
                    <!-- Lineas de la puerta trasera -->
                    <line x1="32" y1="48" x2="32" y2="92" stroke="#1d4ed8" stroke-width="2" stroke-linecap="round"/>

                    <!-- Pin de ubicacion en la caja (telemetria GPS) -->
                    <path d="M83 48 c-9 0 -15 7 -15 15 c0 11 15 25 15 25 s15 -14 15 -25 c0 -8 -6 -15 -15 -15 z" fill="#ffffff"/>
                    <circle cx="83" cy="63" r="5.5" fill="#2563eb"/>

                    <!-- Cabina -->
                    <path d="M148 50 h36 q7 0 11 6 l17 24 q3 4 3 9 v19 h-67 z" fill="#1d4ed8"/>
                    <!-- Ventana -->
                    <path d="M158 57 h24 q4 0 6 3 l12 18 h-42 z" fill="#dbeafe"/>
                    <path d="M162 60 l6 0 l-4 14 l-5 0 z" fill="#ffffff" opacity="0.7"/>
                    <!-- Manija de la puerta -->
                    <rect x="162" y="86" width="10" height="3" rx="1.5" fill="#93c5fd"/>
                    <!-- Faro -->
                    <rect x="207" y="92" width="8" height="7" rx="2" fill="#fde68a"/>

                    <!-- Chasis y parachoques -->
                    <rect x="18" y="100" width="198" height="10" rx="4" fill="#1e3a8a"/>
                    <rect x="208" y="104" width="12" height="7" rx="3" fill="#475569"/>
                </g>

                <!-- Ruedas -->
                <g class="rueda">
                    <circle cx="58" cy="118" r="17" fill="#0f172a"/>
                    <circle cx="58" cy="118" r="9" fill="#cbd5e1"/>
                    <line x1="58" y1="110" x2="58" y2="126" stroke="#64748b" stroke-width="2.5"/>
                    <line x1="50" y1="118" x2="66" y2="118" stroke="#64748b" stroke-width="2.5"/>
                    <circle cx="58" cy="118" r="3" fill="#334155"/>
                </g>
                <g class="rueda">
                    <circle cx="180" cy="118" r="17" fill="#0f172a"/>
                    <circle cx="180" cy="118" r="9" fill="#cbd5e1"/>
                    <line x1="180" y1="110" x2="180" y2="126" stroke="#64748b" stroke-width="2.5"/>
                    <line x1="172" y1="118" x2="188" y2="118" stroke="#64748b" stroke-width="2.5"/>
                    <circle cx="180" cy="118" r="3" fill="#334155"/>
                </g>
            </svg>

            <div id="textoCarga">Conectando con el vehículo...</div>
            <button id="btnCerrarCarga">Reintentar conexión</button>
        </div>
    </div>

    <!-- Panel flotante sobre el mapa -->
    <div class="panel">
        <h1>📡 {{ nombre_pagina }}</h1>

        <select class="selector-modo" onchange="window.location.href=this.value;">
            <option value="/" selected>📡 Modo: En vivo</option>
            <option value="/historial">🕘 Modo: Histórico</option>
        </select>

        <div class="ubicacion">
            <div class="dato-etiqueta">Dirección</div>
            <div id="direccion" class="dato-valor">Esperando ubicación...</div>
            <div class="dato-etiqueta">Barrio / localidad</div>
            <div id="barrio" class="dato-valor">---</div>
        </div>

        <div class="datos">
            <div><div class="dato-etiqueta">Fecha</div><div id="fecha" class="dato-valor">---</div></div>
            <div><div class="dato-etiqueta">Hora COL</div><div id="hora_col" class="dato-valor">---</div></div>
            <div><div class="dato-etiqueta">Envíos</div><div id="puntos" class="dato-valor">0</div></div>
        </div>

        <!-- Latitud y longitud: ocultas hasta que el usuario las pide -->
        <details class="coordenadas">
            <summary>Ver latitud y longitud</summary>
            <div class="coordenadas-cuerpo">
                <div><div class="dato-etiqueta">Latitud</div><div id="lat" class="dato-valor">---</div></div>
                <div><div class="dato-etiqueta">Longitud</div><div id="lon" class="dato-valor">---</div></div>
            </div>
        </details>
    </div>

    <script>
        // Inicializar Mapa centrado en Colombia por defecto
        const map = L.map('map', { zoomControl: false }).setView([4.570868, -74.297333], 6);
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        let marker = L.marker([4.570868, -74.297333], {icon: L.divIcon({html: '🚚', className: 'icono-vivo', iconSize: [30, 30], iconAnchor: [15, 15]})}).addTo(map);

        let esPrimeraUbicacion = true;

        // --- Trazado del recorrido ---
        // Acumula las coordenadas recibidas durante esta sesión de la página.
        // Al recargar el navegador vuelve a empezar vacío.
        let puntosRecorrido = [];

        // La polilínea es la línea que une todos los puntos acumulados.
        // Se crea vacía y se le agregan vértices con addLatLng().
        const lineaRecorrido = L.polyline([], {
            color: '#2563eb',
            weight: 4,
            opacity: 0.75
        }).addTo(map);

        // ===== Pantalla de carga =====
        // Cubre SOLO el mapa, no toda la página: el usuario puede cambiar a
        // la pestaña de Histórico o leer las cápsulas mientras espera.
        // A los 20 s avisa que está tardando; a los 40 s muestra el error
        // con el botón "Reintentar conexión".
        const pantallaCarga = document.getElementById('pantallaCarga');
        const textoCarga = document.getElementById('textoCarga');
        const btnCerrarCarga = document.getElementById('btnCerrarCarga');

        let timerAdvertencia = null;
        let timerError = null;

        // Pone la pantalla en estado "cargando" con el mensaje indicado y
        // arranca los dos avisos. Se usa al abrir la página y en cada reintento.
        function iniciarEspera(mensaje) {
            clearTimeout(timerAdvertencia);
            clearTimeout(timerError);

            pantallaCarga.classList.remove('advertencia', 'error', 'oculta');
            textoCarga.innerText = mensaje;

            timerAdvertencia = setTimeout(function() {
                pantallaCarga.classList.add('advertencia');
                textoCarga.innerText = 'Esto está tardando más de lo normal. Verifica que se haya activado el recorrido.';
            }, 20000);

            timerError = setTimeout(function() {
                pantallaCarga.classList.remove('advertencia');
                pantallaCarga.classList.add('error');
                textoCarga.innerText = 'Ocurrió un error. No se pudo conectar con el vehículo.';
            }, 40000);
        }

        function ocultarPantallaCarga() {
            clearTimeout(timerAdvertencia);
            clearTimeout(timerError);
            pantallaCarga.classList.add('oculta');
        }

        iniciarEspera('Conectando con el vehículo...');

        // Conexión Socket.IO
        const socket = io();

        // Reintentar: si la conexión con el servidor se cayó, la reabre,
        // y vuelve a mostrar el camión esperando el primer dato.
        btnCerrarCarga.addEventListener('click', function() {
            if (!socket.connected) {
                socket.connect();
            }
            iniciarEspera('Intentando conectar de nuevo con el vehículo...');
        });

        // ===== Dirección y barrio =====
        // Se pide al servidor (/api/direccion, que cuida el límite de
        // Nominatim) solo cuando el vehículo se movió al menos 40 m desde la
        // última consulta y pasaron 5 s, para no consultar en cada punto.
        let ultimaConsulta = null;       // {lat, lon, t}
        let consultando = false;

        function distanciaM(lat1, lon1, lat2, lon2) {
            const r = 6371000, rad = g => g * Math.PI / 180;
            const a = Math.sin(rad(lat2 - lat1) / 2) ** 2 +
                      Math.cos(rad(lat1)) * Math.cos(rad(lat2)) * Math.sin(rad(lon2 - lon1) / 2) ** 2;
            return 2 * r * Math.asin(Math.sqrt(a));
        }

        async function actualizarDireccion(lat, lon) {
            if (consultando) return;
            const ahora = Date.now();
            if (ultimaConsulta &&
                (ahora - ultimaConsulta.t < 5000 ||
                 distanciaM(lat, lon, ultimaConsulta.lat, ultimaConsulta.lon) < 40)) return;

            consultando = true;
            try {
                const r = await fetch(`/api/direccion?lat=${lat}&lon=${lon}`);
                if (!r.ok) throw new Error('sin direccion');
                const d = await r.json();
                const lugar = [d.barrio, d.ciudad].filter(Boolean).join(', ');
                document.getElementById('direccion').innerText = d.direccion || d.completa || 'Sin dirección disponible';
                document.getElementById('barrio').innerText = lugar || '---';
                ultimaConsulta = { lat: lat, lon: lon, t: ahora };
            } catch (e) {
                console.error(e);
                // Se conserva lo último mostrado; se reintenta con el siguiente punto.
                ultimaConsulta = ultimaConsulta ? Object.assign(ultimaConsulta, { t: ahora }) : { lat: 0, lon: 0, t: ahora - 3000 };
            } finally {
                consultando = false;
            }
        }

        socket.on('actualizacion_gps', function(msg) {
            // Apenas llega un dato real, se oculta la pantalla de carga
            // sin importar en qué estado estaba.
            ocultarPantallaCarga();

            console.log('Datos recibidos:', msg);

            // Actualizar texto en los óvalos
            document.getElementById('lat').innerText = msg.latitud;
            document.getElementById('lon').innerText = msg.longitud;
            document.getElementById('fecha').innerText = msg.fecha;
            document.getElementById('hora_col').innerText = msg.hora_col;

            // Convertir coordenadas
            const lat = parseFloat(msg.latitud);
            const lon = parseFloat(msg.longitud);

            if (!isNaN(lat) && !isNaN(lon)) {
                const newLatLng = new L.LatLng(lat, lon);

                // Actualizar la posición del pin
                marker.setLatLng(newLatLng);

                // Agregar el punto al recorrido y extender la línea.
                puntosRecorrido.push(newLatLng);
                lineaRecorrido.addLatLng(newLatLng);
                document.getElementById('puntos').innerText = puntosRecorrido.length;
                actualizarDireccion(lat, lon);

                if (esPrimeraUbicacion) {
                    // Solo la primera vez hacemos zoom inicial automático
                    map.setView(newLatLng, 15);
                    esPrimeraUbicacion = false;
                } else {
                    // Centramos la cámara suavemente manteniendo el zoom del usuario
                    map.panTo(newLatLng);
                }
            }
        });
    </script>
</body>
</html>
