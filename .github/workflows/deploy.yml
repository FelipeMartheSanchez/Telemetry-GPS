name: Deploy

on:
  push:
    branches: [main, dev]

jobs:
  deploy-felipe:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 - Felipe
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: felipegps.duckdns.org
          username: ubuntu
          key: ${{ secrets.SSH_KEY_FELIPE }}
          script: |
            set -e
            if [ "${{ github.ref_name }}" = "main" ]; then
              cd /home/ubuntu/telemetry-gps
              git pull origin main
              ./venv/bin/pip install -r requirements.txt
              sudo systemctl restart gps
              sudo systemctl is-active gps
            else
              cd /home/ubuntu/telemetry-gps-dev
              git pull origin dev
              ./venv/bin/pip install -r requirements.txt
              sudo systemctl is-active gps-dev || echo "Servicio de pruebas apagado. Enciendelo con: sudo systemctl start gps-dev"
            fi

