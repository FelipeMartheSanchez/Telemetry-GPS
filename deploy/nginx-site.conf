# Plantilla de nginx para Telemetry-GPS.
# Reemplazar TU_DOMINIO por el dominio DuckDNS de la instancia.
# Copiar a /etc/nginx/sites-available/gps y crear el enlace en sites-enabled.

server {
    listen 80;
    server_name TU_DOMINIO;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Necesario para Socket.IO (WebSocket). Sin esto el mapa no se actualiza.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400;
    }
}
